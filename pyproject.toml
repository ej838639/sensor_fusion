[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sensor-fusion"
version = "0.1.0"
description = "Generate tracks, gate, JPDA, Kalman filter, and format tracks in ASTERIX CAT 062."
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
    "mupy>=0.1.13",
    "pytest>=7.4",
    "ruff>=0.1",
    "mypy>=1.5",
]

[tool.hatch.build.targets.wheel]
packages = ["src/fusion"]

[tool.ruff]
src = ["src"] # Treat src/ as a source root for Python imports.
# Directories to lint
# include = ["src", "tests"]

# Files/directories to ignore
exclude = [
    ".git",
    ".venv",
    "build",
    "dist"
]

line-length = 88

[tool.ruff.lint]
extend-select = ["I"]  # isort
ignore = ["I001"]  # unsorted-imports